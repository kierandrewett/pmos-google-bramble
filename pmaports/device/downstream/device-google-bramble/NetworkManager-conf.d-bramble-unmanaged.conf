# The vendor WCNSS_qcom_cfg.ini makes qcacld create a second station
# interface (gEnableConcurrentSTA=wlan1), a P2P interface and a NAN
# interface (gEnableNanSupport=1). Only manage wlan0, so NetworkManager
# and Phosh show one Wi-Fi device.
[keyfile]
unmanaged-devices+=interface-name:wlan1;interface-name:p2p0;interface-name:wifi-aware0
