Syntax 4

# Pixel 4a (5G) downstream ASoC card (techpack/audio, lito-bramble-audio.dtsi).
# Control names and values come from the stock
# /vendor/etc/mixer_paths_bolero_snd.xml (UP1A.231105.001.B2).

SectionUseCase."HiFi" {
	File "/Google/bramble/HiFi.conf"
	Comment "Play and record HiFi quality music"
}

BootSequence [
	cset "name='Main AMP Enable Switch' 0"
	cset "name='R Main AMP Enable Switch' 0"
]
