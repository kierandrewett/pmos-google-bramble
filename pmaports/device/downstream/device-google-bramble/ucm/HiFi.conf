# Pixel 4a (5G) HiFi verb. Playback and capture both use MultiMedia1
# (PCM device 0), like "deep-buffer-playback" and "audio-record" in the
# stock mixer paths.
#
# The headset jack is only reported as input devices, not as an ALSA jack
# control, so PulseAudio cannot switch outputs on plug-in. The built-in
# speaker and microphone therefore have the higher priorities.

SectionVerb {
	EnableSequence [
		# CS35L41 speaker amps on QUIN TDM (stock defaults)
		cset "name='QUIN_TDM_RX_0 Channels' Two"
		cset "name='QUIN_TDM_RX_0 Format' S32_LE"
		cset "name='QUIN_TDM_RX_0 SampleRate' KHZ_48"
		cset "name='ASPRX1 Slot Position' 0"
		cset "name='R ASPRX1 Slot Position' 1"
		# Stock runs the Cirrus speaker protection firmware (PCM Source
		# DSP). That needs per-device calibration, so bypass the amp DSP
		# and keep 6 dB of headroom below the stock 0 dB volume (817).
		cset "name='PCM Source' ASP"
		cset "name='R PCM Source' ASP"
		cset "name='AMP PCM Gain' 17"
		cset "name='R AMP PCM Gain' 17"
		cset "name='Digital PCM Volume' 769"
		cset "name='R Digital PCM Volume' 769"
		# RT5514 microphones on PRI TDM. Mono capture returns only
		# zeros, so capture two channels.
		cset "name='PRI_TDM_TX_0 Channels' Two"
		cset "name='PRI_TDM_TX_0 Format' S16_LE"
		cset "name='Stereo1 DMIC Mux' DMIC1"
		cset "name='ADC1 Capture Volume' 40"
		# Headphones (WCD938x via RX macro)
		cset "name='RX_CDC_DMA_RX_0 Channels' Two"
		cset "name='RX_CDC_DMA_RX_0 Format' S24_3LE"
		# Headset mic (WCD938x via TX macro)
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		# The DSP rejects hw_params on MultiMedia1 while no backend is
		# routed to it, and PulseAudio then drops the card while probing.
		# Keep the speaker and main mic backends routed; the devices
		# below switch the amps and the extra headset backends.
		cset "name='QUIN_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia1 Mixer PRI_TDM_TX_0' 1"
	]
	DisableSequence [
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='Main AMP Enable Switch' 1"
		cset "name='R Main AMP Enable Switch' 1"
	]
	DisableSequence [
		cset "name='Main AMP Enable Switch' 0"
		cset "name='R Main AMP Enable Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_HPH_PWR_MODE' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='RX_RX0 Digital Volume' 74"
		cset "name='RX_RX1 Digital Volume' 74"
	]
	DisableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"
	ConflictingDevice [
		"HeadsetMic"
	]
	EnableSequence [
		cset "name='Sto1 ADC MIXL DMIC Switch' 1"
		cset "name='Sto1 ADC MIXR DMIC Switch' 1"
	]
	DisableSequence [
		cset "name='Sto1 ADC MIXL DMIC Switch' 0"
		cset "name='Sto1 ADC MIXR DMIC Switch' 0"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='MultiMedia1 Mixer PRI_TDM_TX_0' 0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Volume' 12"
		cset "name='TX_DEC0 Volume' 94"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia1 Mixer PRI_TDM_TX_0' 1"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}
