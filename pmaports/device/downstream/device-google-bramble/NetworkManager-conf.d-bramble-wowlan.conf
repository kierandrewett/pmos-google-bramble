# Without WoWLAN, cfg80211 disconnects Wi-Fi on suspend. On qcacld that
# disconnect raises a firmware wake interrupt, which aborts the suspend
# ("early wake event detected"). Arm wake on disconnect, magic packet and
# GTK rekey failure (4 + 8 + 16) so the link stays up while suspended.
[connection]
wifi.wake-on-wlan=28
