# Pixel 4a (5G): WirePlumber settings for the PipeWire audio backend.

# PipeWire adds a compress-offload device (alsa_card.comprC0) for the same
# sound card. Two devices then try to set up the one card, and the audio
# routing breaks. Disable the compress-offload device.
monitor.alsa.rules = [
  {
    matches = [ { device.api = "alsa:compressed" } ]
    actions = { update-props = { device.disabled = true } }
  }
]

# The cameras do not work on this kernel, and WirePlumber stops handling
# events after it probes the downstream V4L2 nodes (QUERYCAP fails on
# /dev/video*). The speaker and microphone nodes then get no session items,
# no stream is linked and nothing plays. Do not monitor cameras.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
