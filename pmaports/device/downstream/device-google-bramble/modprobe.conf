# Pixel 4a (5G): stop udev and mdev from loading these modules by alias.
# The downstream drivers need the stock Android load order. Loading them
# in parallel by alias freezes the phone. The initramfs loads them by name
# in stock order (modules-initfs), OpenRC loads the rest (modules-load.d).
# 'blacklist' only affects alias lookups; modprobe <name> still works.
# qrtr is not listed: the kernel requests it by alias (net-pf-42).
