# Pixel 4a (5G): loudness processing for the built-in speaker.
#
# Stock Android runs the Cirrus speaker protection DSP, which also makes
# the small speaker louder. This port bypasses that DSP, so quiet and
# medium volume levels sound much lower than on stock. Raise the signal by
# 6 dB and let a look-ahead limiter hold the peaks at -1 dBFS: quiet
# content gets 6 dB louder, the loudest content stays at the same level.
# WirePlumber inserts this filter in front of the speaker sink only
# ("smart filter"), so headphones are not affected.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speaker loudness"
      media.name = "Speaker loudness"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = lim
            plugin = /usr/lib/ladspa/lsp-plugins-ladspa.so
            label = "http://lsp-plug.in/plugins/ladspa/limiter_stereo"
            control = {
              "Bypass" = 0
              "Input gain (G)" = 2.0
              "Threshold (G)" = 0.89
              "Gain boost" = 0
              "Automatic level regulation" = 0
              "Lookahead (ms)" = 5.0
            }
          }
        ]
        inputs = [ "lim:Input L" "lim:Input R" ]
        outputs = [ "lim:Output L" "lim:Output R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "bramble-speaker-loudness"
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "bramble-speaker-loudness"
        filter.smart.target = {
          node.name = "alsa_output.platform-soc_qcom_msm-audio-apr_qcom_q6core-audio_sound.HiFi__Speaker__sink"
        }
      }
      playback.props = {
        node.name = "bramble-speaker-loudness.output"
        node.passive = true
        stream.dont-remix = true
      }
    }
  }
]
